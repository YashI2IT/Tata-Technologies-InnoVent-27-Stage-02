AWSTemplateFormatVersion: '2010-09-09'
Description: 'AeroEdge-X AWS Cloud Synchronization Infrastructure'

Resources:
  AeroEdgeS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AeroEdgeDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AeroEdge-Inspections
      AttributeDefinitions:
        - AttributeName: inspection_id
          AttributeType: S
      KeySchema:
        - AttributeName: inspection_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  SyncLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AeroEdgeSyncPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt AeroEdgeDynamoDBTable.Arn

  SyncLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aeroedge-sync-handler
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: !GetAtt SyncLambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          from botocore.exceptions import ClientError

          dynamodb = boto3.resource('dynamodb')
          TABLE_NAME = os.environ.get('DYNAMODB_TABLE')
          table = dynamodb.Table(TABLE_NAME) if TABLE_NAME else None

          def lambda_handler(event, context):
              try:
                  if 'body' in event and isinstance(event['body'], str):
                      payload = json.loads(event['body'])
                  elif 'body' in event and isinstance(event['body'], dict):
                      payload = event['body']
                  else:
                      payload = event

                  inspection_id = payload.get('inspection_id')
                  device_id = payload.get('device_id')
                  
                  if not inspection_id or not device_id:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'Missing required fields: inspection_id, device_id'})
                      }

                  item = {
                      'inspection_id': str(inspection_id),
                      'device_id': str(device_id),
                      'timestamp': str(payload.get('timestamp', '')),
                      'defect': str(payload.get('defect', 'none')),
                      'confidence': str(payload.get('confidence', '0.0')),
                      'severity': str(payload.get('severity', 'none')),
                      'bbox': json.dumps(payload.get('bbox', {})),
                      'model': str(payload.get('model', 'yolov11')),
                      'model_version': str(payload.get('model_version', 'v1')),
                      'inference_device': str(payload.get('inference_device', 'edge')),
                      'report_key': str(payload.get('report_key', '')),
                      'image_key': str(payload.get('image_key', '')),
                      'sync_timestamp': str(context.aws_request_id if hasattr(context, 'aws_request_id') else '')
                  }

                  try:
                      table.put_item(
                          Item=item,
                          ConditionExpression='attribute_not_exists(inspection_id)'
                      )
                      return {
                          'statusCode': 200,
                          'body': json.dumps({'status': 'success', 'message': 'Inspection metadata synchronized.'})
                      }
                  except ClientError as e:
                      if e.response['Error']['Code'] == 'ConditionalCheckFailedException':
                          return {
                              'statusCode': 200,
                              'body': json.dumps({'status': 'success', 'message': 'Inspection already synchronized.'})
                          }
                      raise e

              except Exception as e:
                  print(f"Error processing sync: {e}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref AeroEdgeDynamoDBTable

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: AeroEdgeSyncAPI
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SyncLambdaFunction.Arn
      PayloadFormatVersion: "2.0"

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /sync/inspection"
      AuthorizationType: AWS_IAM
      Target: !Join ["/", ["integrations", !Ref HttpApiIntegration]]

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SyncLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/sync/inspection"

  EdgeDeviceUser:
    Type: AWS::IAM::User
    Properties:
      UserName: AeroEdge-Jetson-Agent

  EdgeDeviceAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AeroEdgeDeviceSyncPolicy
      Users:
        - !Ref EdgeDeviceUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub "${AeroEdgeS3Bucket.Arn}/*"
          - Effect: Allow
            Action:
              - execute-api:Invoke
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/sync/inspection"

Outputs:
  BucketName:
    Value: !Ref AeroEdgeS3Bucket
  DynamoTableName:
    Value: !Ref AeroEdgeDynamoDBTable
  ApiEndpoint:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/sync/inspection"
