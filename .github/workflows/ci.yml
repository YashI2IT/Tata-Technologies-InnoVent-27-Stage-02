name: AeroEdge-X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors werkzeug python-dotenv argon2-cffi reportlab
          pip install langchain langchain-community langchain-chroma langchain-huggingface langchain-text-splitters langchain-ollama
          pip install chromadb sentence-transformers pymupdf

      - name: Syntax validation
        run: python -m py_compile app.py

      - name: Backend module validation
        run: |
          python -m py_compile backend/config.py
          python -m py_compile backend/agents/vision_agent.py
          python -m py_compile backend/agents/rag_agent.py
          python -m py_compile backend/agents/reasoning_agent.py
          python -m py_compile backend/agents/digital_twin.py
          python -m py_compile backend/services/report_generator.py

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit || true

      - name: Build (web mode)
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ""
          VITE_DEMO_MODE: "true"
